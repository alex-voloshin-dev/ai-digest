name: AI Digest

on:
  schedule:
    # 11:00 UTC daily (~07:00 America/New_York). Change this line to retime.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ai-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser pyyaml

      - name: Build the digest page
        run: python build_digest.py

      - name: Commit updated page and archive
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html digest_archive.jsonl
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
